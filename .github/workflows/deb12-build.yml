name: Build Telegram Bot API (Debian 12)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'v2.1.0'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Compiling on debian-12
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: 📦 Install Dependencies
        run: |
          apt-get update
          apt-get install -y make git zlib1g-dev libssl-dev gperf cmake clang libc++-dev libc++abi-dev zip

      - name: 📥 Clone Source Code
        run: git clone --recursive https://github.com/tdlib/telegram-bot-api.git src

      - name: ⚙️ Compile Binary (Release Mode)
        run: |
          cd src && mkdir build && cd build
          export CC=clang CXX=clang++
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=../../out ..
          cmake --build . --target install -j2

      - name: 🚀 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-12
          path: out/bin/telegram-bot-api
          retention-days: 1

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Compiled Binary
        uses: actions/download-artifact@v4
        with:
          path: all-binaries

      - name: 🗜️ Prepare Assets and Checksums
        run: |
          mkdir final-assets
          cd all-binaries
          for os_dir in *; do
            if [ -d "$os_dir" ]; then
              chmod +x "$os_dir/telegram-bot-api"
              zip -j "../final-assets/telegram-bot-api-$os_dir.zip" "$os_dir/telegram-bot-api"
            fi
          done

      - name: 🎉 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: 'Telegram Bot API Server ${{ github.event.inputs.version_tag }} (Debian 12)'
          body: |
            ## 🚀 Pre-compiled Binary for Debian 12 (Bookworm)

            Binary `telegram-bot-api` server yang dikompilasi khusus untuk **Debian 12**.

            ### 🛠️ Cara Penggunaan:
            1. Unduh file `telegram-bot-api-debian-12.zip`.
            2. Ekstrak file: `unzip telegram-bot-api-debian-12.zip`
            3. Berikan izin eksekusi: `chmod +x telegram-bot-api`
            4. Jalankan server:
               ```bash
               ./telegram-bot-api --api-id=YOUR_ID --api-hash=YOUR_HASH --local --http-port=8081
               ```

            *Diproses secara otomatis menggunakan GitHub Actions.*
          draft: false
          prerelease: false
          files: final-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
